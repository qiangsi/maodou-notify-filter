name: android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true
      - name: Build APK (aapt2 + javac + d8)
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -e
          SDK=$ANDROID_HOME
          BT=$SDK/build-tools/34.0.0
          PLAT=$SDK/platforms/android-34/android.jar
          mkdir -p build/gen build/obj build/dex
          $BT/aapt2 compile --dir app/src/main/res -o build/res.zip
          $BT/aapt2 link -o build/base.apk -I $PLAT --manifest app/src/main/AndroidManifest.xml \
            --min-sdk-version 24 --target-sdk-version 34 \
            --java build/gen --auto-add-overlay build/res.zip
          javac -source 11 -target 11 -classpath $PLAT -d build/obj \
            build/gen/com/maodou/notifyfilter/R.java \
            $(find app/src/main/java -name '*.java')
          $BT/d8 --release --min-api 24 --lib $PLAT --output build/dex $(find build/obj -name '*.class')
          python3 - <<'PYEOF'
          import zipfile
          src = zipfile.ZipFile('build/base.apk')
          out = zipfile.ZipFile('build/unsigned.apk','w', zipfile.ZIP_STORED)
          # 逐条目保留原始压缩方式（resources.arsc 必须 STORED，Android 11+ 硬性要求）
          for i in src.infolist():
              out.writestr(i, src.read(i.filename), compress_type=i.compress_type)
          out.writestr('classes.dex', open('build/dex/classes.dex','rb').read(), compress_type=zipfile.ZIP_DEFLATED)
          out.close()
          print('apk entries:', len(src.namelist())+1)
          PYEOF
          $BT/zipalign -f 4 build/unsigned.apk build/aligned.apk
          # 固定 keystore（base64 secrets.RELEASE_KEYSTORE），保证每次构建签名一致，可覆盖升级
          echo "$RELEASE_KEYSTORE" | base64 -d > /tmp/release.keystore
          $BT/apksigner sign --ks /tmp/release.keystore --ks-pass pass:android --out notify-filter.apk build/aligned.apk
          $BT/apksigner verify notify-filter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: notify-filter-apk
          path: notify-filter.apk
